<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Homework Helper Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="chat-container">
  <h1>🤖 Shadow AI Helper</h1>

  <div class="modes">
    <button id="btn-normal" class="active" onclick="setMode('normal')">Normal</button>
    <button id="btn-exam" onclick="setMode('exam')">Exam Mode</button>
    <button id="btn-check" onclick="setMode('check')">Check Answer</button>
    <button onclick="startVoice()">🎤 Speak</button>
  </div>

  <div id="chat-box"></div>

  <div class="input-area">
    <input id="question" placeholder="Ask anything...">
    <button onclick="getAnswer()">Send</button>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
